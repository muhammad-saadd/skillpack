<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orangebox design — %% TITLE</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { max-width: 1100px; margin: 0 auto; padding: 1.5rem; background: Canvas; color: CanvasText; }
  header, section { margin-block: 1rem; padding: 1rem; border: 1px solid #8886; border-radius: .6rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  h2 { margin: 0 0 .8rem; font-size: 1rem; }
  .meta, .note { color: GrayText; }
  svg { display: block; width: 100%; height: auto; max-height: 32rem; }
  svg text { fill: CanvasText; font: 14px system-ui, sans-serif; }
  .node rect, .node polygon { fill: Canvas; stroke: #667; stroke-width: 1.5; rx: 8; }
  .existing rect, .existing polygon { fill: #e8edf7; stroke: #55627a; }
  .proposed rect, .proposed polygon { fill: #e3f3e6; stroke: #2f7a45; stroke-width: 2; }
  .changed rect, .changed polygon { fill: #fbf1d9; stroke: #a8761c; stroke-width: 2; }
  .removed rect, .removed polygon { fill: #f8e1df; stroke: #a8433a; stroke-dasharray: 4 3; }
  .edge { fill: none; stroke: #55627a; stroke-width: 1.6; }
  .failure { stroke: #a8433a; stroke-dasharray: 5 4; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>%% TITLE</h1>
  <p class="meta">Source: %% SOURCE · dashed red arrows show failure paths</p>
</header>
<section>
  <h2>Flow</h2>
  <svg role="img" aria-labelledby="flow-title flow-desc" viewBox="0 0 900 300">
    <title id="flow-title">Behavior flow</title><desc id="flow-desc">%% FLOW SUMMARY</desc>
    <defs><marker id="flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#667"/></marker></defs>
    %% FLOW SVG
  </svg>
  <details><summary>Flow labels and evidence</summary><pre>%% FLOW NOTES</pre></details>
</section>
<section>
  <h2>States</h2>
  <svg role="img" aria-labelledby="state-title state-desc" viewBox="0 0 900 220">
    <title id="state-title">State transitions</title><desc id="state-desc">%% STATE SUMMARY</desc>
    <defs><marker id="state-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#667"/></marker></defs>
    %% STATE SVG
  </svg>
</section>
<section>
  <h2>Modules and types</h2>
  <svg role="img" aria-labelledby="class-title class-desc" viewBox="0 0 900 220">
    <title id="class-title">Touched modules and types</title><desc id="class-desc">%% CLASS SUMMARY</desc>
    <defs><marker id="class-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#667"/></marker></defs>
    %% CLASS SVG
  </svg>
</section>
<section><h2>Notes</h2><pre>%% NOTES</pre></section>
</body>
</html>
